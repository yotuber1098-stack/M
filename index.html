<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 💞</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff758c,#ff7eb3);
            font-family:Arial, sans-serif;
            overflow:hidden;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation:flotar 3s ease-in-out infinite;
            max-width:500px;
        }

        h1{
            color:#ff4f81;
            font-size:40px;
            margin-bottom:10px;
        }

        p{
            color:#444;
            font-size:20px;
            line-height:1.6;
        }

        .heart{
            font-size:70px;
            animation:latido 1s infinite;
        }

        button{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:#ff4f81;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ff2e6d;
            transform:scale(1.05);
        }

        @keyframes latido{
            0%{transform:scale(1);}
            50%{transform:scale(1.2);}
            100%{transform:scale(1);}
        }

        @keyframes flotar{
            0%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
            100%{transform:translateY(0);}
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Para Ti</h1>
        <p>
            Desde que llegaste a mi vida,
            todo se siente más bonito.
            Gracias por existir y hacerme sonreír cada día.
        </p>

        <button onclick="mensaje()">Presióname</button>
    </div>

    <script>
        function mensaje(){
            alert("Te quiero muchísimo 💞");
        }
    </script>

</body>
</html>
